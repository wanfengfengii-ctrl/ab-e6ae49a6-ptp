name: ptpv2-audit

services:
  api:
    build: .
    image: ptpv2-audit-api
    ports:
      # Host port is configurable through the API_HOST_PORT environment
      # variable (see .env.example); the container always listens on 8000.
      - "${API_HOST_PORT:-8080}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  # One-shot verification: runs the code tests, the application build check
  # and an API smoke test of complete exchanges, then exits.  Its exit code
  # reports the outcome (use --exit-code-from verify).
  verify:
    image: ptpv2-audit-api
    build: .
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:8000
    command: ["sh", "verify/run.sh"]
    restart: "no"
